services:

  # ── Application ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: promptedit_app_dev
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env.docker
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_LEVEL: debug
      DB_HOST: db
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    volumes:
      # Mount source for live editing (without node_modules/vendor)
      - .:/var/www/html
      - /var/www/html/node_modules
      - /var/www/html/vendor
      - app_storage_dev:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - promptedit_dev

  # ── MySQL 8 ──────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: promptedit_db_dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: promptedit
      MYSQL_USER: promptedit
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data_dev:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - promptedit_dev

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: promptedit_redis_dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - promptedit_dev

  # ── Vite Dev Server ──────────────────────────────────────────
  vite:
    image: node:22-alpine
    container_name: promptedit_vite
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - promptedit_dev

volumes:
  app_storage_dev:
  db_data_dev:

networks:
  promptedit_dev:
    driver: bridge
