; ============================================================
; PHP-FPM pool configuration (www pool)
; ============================================================

[www]
user  = www-data
group = www-data

; Listen on TCP — Nginx connects to 127.0.0.1:9000
listen = 127.0.0.1:9000

; Process manager
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500

; Logging
access.log           = /dev/null
php_admin_value[error_log]  = /dev/stderr
php_admin_flag[log_errors]  = on

; Timeouts
request_terminate_timeout = 90

; Pass environment variables to PHP
clear_env = no
