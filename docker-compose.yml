services:

  # ── Application (PHP-FPM + Nginx + Queue Worker via supervisord) ─────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: promptedit_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-promptedit}
      DB_USERNAME: ${DB_USERNAME:-promptedit}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - promptedit

  # ── MySQL 8 ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: promptedit_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-promptedit}
      MYSQL_USER: ${DB_USERNAME:-promptedit}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT_HOST:-3308}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - promptedit

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: promptedit_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT_HOST:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - promptedit

volumes:
  app_storage:
  db_data:
  redis_data:

networks:
  promptedit:
    driver: bridge
